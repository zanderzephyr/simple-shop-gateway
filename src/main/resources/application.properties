server.port=${SIMPLE_SHOP_GATEWAY_PORT:8080}

simple-shop.allowed-origin=${SIMPLE_SHOP_ALLOWED_ORIGIN:http://localhost:4200}

auth-service.host=${SIMPLE_SHOP_AUTH_SERVICE_HOST:localhost}
auth-service.port=${SIMPLE_SHOP_AUTH_SERVICE_PORT:8081}
auth-service.url=http://${auth-service.host}:${auth-service.port}

user-service.host=${SIMPLE_SHOP_USER_SERVICE_HOST:localhost}
user-service.port=${SIMPLE_SHOP_USER_SERVICE_PORT:8082}
user-service.url=http://${user-service.host}:${user-service.port}

# Route 1: Auth service
spring.cloud.gateway.routes[0].id=auth_service_route
spring.cloud.gateway.routes[0].uri=http://${SIMPLE_SHOP_AUTH_SERVICE_HOST:localhost}:${SIMPLE_SHOP_AUTH_SERVICE_PORT:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Route 2: User service
spring.cloud.gateway.routes[1].id=user_service_route
spring.cloud.gateway.routes[1].uri=http://${SIMPLE_SHOP_USER_SERVICE_HOST:localhost}:${SIMPLE_SHOP_USER_SERVICE_PORT:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**

# Route 3: Item service
spring.cloud.gateway.routes[2].id=item_service_route
spring.cloud.gateway.routes[2].uri=http://${SIMPLE_SHOP_ITEM_SERVICE_HOST:localhost}:${SIMPLE_SHOP_ITEM_SERVICE_PORT:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/items/**

# See https://docs.spring.io/spring-boot/reference/features/logging.html
# Sets the minimal log level for the whole app.
logging.level.root=${SIMPLE_SHOP_GATEWAY_LOG_LEVEL_ROOT:INFO}