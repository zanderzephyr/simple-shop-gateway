server.port=${SIMPLE_SHOP_GATEWAY_PORT:8080}

# Route 1: Auth service
spring.cloud.gateway.server.webflux.routes[0].id=auth_service_route
spring.cloud.gateway.server.webflux.routes[0].uri=http://${SIMPLE_SHOP_AUTH_SERVICE_HOST:localhost}:${SIMPLE_SHOP_AUTH_SERVICE_PORT:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

# Route 2: User service
spring.cloud.gateway.server.webflux.routes[1].id=user_service_route
spring.cloud.gateway.server.webflux.routes[1].uri=http://${SIMPLE_SHOP_USER_SERVICE_HOST:localhost}:${SIMPLE_SHOP_USER_SERVICE_PORT:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/users/**

# Route 3: Item service
spring.cloud.gateway.server.webflux.routes[2].id=item_service_route
spring.cloud.gateway.server.webflux.routes[2].uri=http://${SIMPLE_SHOP_ITEM_SERVICE_HOST:localhost}:${SIMPLE_SHOP_ITEM_SERVICE_PORT:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/items/**

# See https://docs.spring.io/spring-boot/reference/features/logging.html
# Sets the minimal log level for the whole app.
logging.level.root=${SIMPLE_SHOP_GATEWAY_LOG_LEVEL_ROOT:INFO}